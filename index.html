  <div class="calculator" id="calc">
    <div class="calc-title">
      <span>Calculator</span>
      <button class="close-btn" onclick="closeCalc()">✕</button>
    </div>
    <div class="calc-screen" id="screen">0</div>
    <div class="calc-buttons">
      <button onclick="clearScreen()">C</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="press('/')">/</button>
      <button onclick="press('*')">⌫</button>

      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('-')">−</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('+')">+</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="blue" onclick="calculate()" style="grid-row: span 2;">=</button>

      <button onclick="press('0')" style="grid-column: span 2;">0</button>
      <button onclick="press('.')">.</button>
    </div>
  </div>

  <!-- taskbar -->
  <div class="taskbar">
