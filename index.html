<title>LxgendOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Korataki:wght@800&display=swap" rel="stylesheet">

<body>

<div id="bg-layer"></div>

<!-- BOOT -->
<div id="boot" onclick="dismissBoot()">
  <div id="boot-bg"></div>
  <div id="boot-dim"></div>
  <div class="boot-content">
    <div class="boot-time" id="boot-time">--:--</div>
    <div class="boot-date" id="boot-date">---</div>
  </div>
  <div class="boot-hint">Click anywhere to continue</div>
  <div class="boot-logo">LxgendOS</div>
</div>

<div id="dim-overlay"></div>

<!-- DESKTOP ICONS -->
<div class="icons">
  <div class="icon" onclick="openWin('calc')">
    <div class="ic"><svg viewBox="0 0 48 48" fill="none"><rect x="8" y="6" width="32" height="36" rx="4" class="acc"/><rect x="12" y="12" width="24" height="8" rx="2" fill="#ffffff"/><circle cx=



    <div class="theme-body">
      <div class="theme-section">
        <div class="theme-label">Wallpaper</div>
        <div class="theme-grid">
          <div class="bg-thumb" onclick="setBg('BGs/bg1.jpg', this)" style="background-image:url('BGs/bg1.jpg')"></div>
          <div class="bg-thumb" onclick="setBg('BGs/bg2.jpg', this)" style="background-image:url('BGs/bg2.jpg')"></div>
          <div class="bg-thumb" onclick="setBg('BGs/bg3.jpg', this)" style="background-image:url('BGs/bg3.jpg')"></div>
          <div class="bg-thumb" onclick="setBg('BGs/bg4.jpg', this)" style="background-image:url('BGs/bg4.jpg')"></div>
          <div class="bg-thumb" onclick="setBg('BGs/bg5.png', this)" style="background-image:url('BGs/bg5.png')"></div>
        </div>
      </div>

      <div class="theme-section">
        <div class="theme-label">Solid</div>
        <div class="color-row">
          <div class="color-swatch" style="background:#000000" onclick="setBg('#000000')"></div>
          <div class="color-swatch" style="background:#1a0000" onclick="setBg('#1a0000')"></div>
          <div class="color-swatch" style="background:#2b0000" onclick="setBg('#2b0000')"></div>
          <div class="color-swatch" style="background:#1a1a1a" onclick="setBg('#1a1a1a')"></div>
          <div class="color-swatch" style="background:#0d0d1a" onclick="setBg('#0d0d1a')"></div>
          <div class="color-swatch" style="background:#0d1a0d" onclick="setBg('#0d1a0d')"></div>
          <div class="color-swatch" style="background:#1a0d1a" onclick="setBg('#1a0d1a')"></div>
        </div>
      </div>

      <div class="theme-section">
        <div class="theme-label">Mode</div>
        <div class="toggle-row">
          <button class="mode-btn active" id="mode-dark" onclick="setMode('dark')">Dark</button>
          <button class="mode-btn" id="mode-light" onclick="setMode('light')">Light</button>
        </div>
      </div>
    </div>
  </div>
